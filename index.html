<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            line-height: 1.6;
        }

        header {
            background: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            background: #f4f4f4;
            padding: 60px 20px;
            text-align: center;
        }

        .hero h1 {
            margin-bottom: 10px;
        }

        .hero p {
            margin-bottom: 20px;
        }

        .btn {
            background: #333;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #555;
        }

        .content {
            padding: 40px 20px;
            text-align: center;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h2>MySite</h2>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Welcome to My Website</h1>
    <p>This is a simple website built with HTML and CSS.</p>
    <a href="#" class="btn">Get Started</a>
</section>

<section class="content">
    <h2>About Us</h2>
    <p>This is where you can add information about your website.</p>
</section>

<footer>
    <p>© 2026 MySite. All rights reserved.</p>
</footer>

</body>
</html>
